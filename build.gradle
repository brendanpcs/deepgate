plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

repositories {
	mavenCentral()
}

sourceSets {
	// Game tests compile and run against exactly what main sees: Minecraft, Fabric API, and the
	// mod itself. Loom does not extend its Minecraft classpath to extra source sets on its own.
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	// Deepgate is a server-side mod: no client source set, no split environments.
	mods {
		"deepgate" {
			sourceSet sourceSets.main
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			name = "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/junit.xml"
			runDir "build/gametest"
		}
	}
}

dependencies {
	// Minecraft 26.x ships unobfuscated, so there is no `mappings` line and
	// dependencies use `implementation` rather than `modImplementation`.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile the game tests as part of a normal build, so a broken test cannot pass `build`
// and only surface later when someone actually runs `runGametest`.
tasks.named('check') {
	dependsOn tasks.named('compileGametestJava')
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
